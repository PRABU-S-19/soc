# Render Blueprint. In Render: New > Blueprint, pick this repository.
# For an existing Web Service, copy the same values into its Settings.
services:
  - type: web
    name: soc-sim
    runtime: node
    plan: free
    # devDependencies (Vite, React) are needed to build the UI.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # PORT is set by Render automatically; do not add it.
      # SOC_SIM_DATA is optional (path of the case store file).
